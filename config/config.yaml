endpoints:
  # GROUPE : SITES INTERNET
  - name: "Site Vitrine"
    group: "Sites internet"
    url: "https://www.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: "Portfolio"
    group: "Sites internet"
    url: "https://louis.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: "Documentation"
    group: "Sites internet"
    url: "https://docs.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  # GROUPE : COMPUTE (HYPERVISEURS)
  - name: "Hyperviseur 1"
    group: "Compute"
    url: "icmp://pve1.infra.loutik.fr"
    display-name: "Hyperviseur 1"
    client:
      dns-resolver: "udp://10.0.13.1:53"
    interval: 10s
    conditions:
      - "[CONNECTED] == true"

  - name: "Hyperviseur 2"
    group: "Compute"
    url: "icmp://pve2.infra.loutik.fr"
    display-name: "Hyperviseur 2"
    client:
      dns-resolver: "udp://10.0.13.1:53"
    interval: 10s
    conditions:
      - "[CONNECTED] == true"

  - name: "Hyperviseur 3"
    group: "Compute"
    url: "icmp://pve3.infra.loutik.fr"
    display-name: "Hyperviseur 3"
    client:
      dns-resolver: "udp://10.0.13.1:53"
    interval: 10s
    conditions:
      - "[CONNECTED] == true"

  # GROUPE : Network
  - name: NS1 (Autoritaire)
    url: "10.0.13.1"
    interval: 10s
    dns:
      query-name: "ns1.infra.loutik.fr"
      query-type: "A"
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"

  - name: NS2 (Autoritaire)
    url: "10.0.13.2"
    interval: 10s
    dns:
      query-name: "ns2.infra.loutik.fr"
      query-type: "A"
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"

  - name: DNS1 (Récursif)
    url: "10.0.13.253"
    interval: 10s
    dns:
      query-name: "ns2.infra.loutik.fr"
      query-type: "A"
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"
      
  - name: DNS2 (Récursif)
    url: "10.0.13.252"
    interval: 10s
    dns:
      query-name: "ns2.infra.loutik.fr"
      query-type: "A"
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"

  # GROUPE : SERVICES
  - name: "LoutikSSO (Authentik)"
    group: "Services"
    url: "https://sso.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: "LoutikSPEED (Speedtest)"
    group: "Services"
    url: "https://speedtest.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: "LoutikPDF (PDF Tool)"
    group: "Services"
    url: "https://pdf.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: "LoutikVIEW (Monitoring)"
    group: "Services"
    url: "https://monitoring.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: "LoutikDIGEST (Veille techno)"
    group: "Services"
    url: "https://digest.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: "Miniflux (Veille techno)"
    group: "Services"
    url: "https://rss.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
